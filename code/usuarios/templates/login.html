{% extends "base.html" %}

{% block titulo %}
    Acolhe - Login
{% endblock %}

{% block conteudo %}
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="fas fa-paw fa-3x text-success"></i>
                            <h1 class="h3 mt-2">Login</h1>
                            <p class="text-secondary mb-0">Entre para acessar a área do Acolhe.</p>
                        </div>
                        <form action="{% url 'login' %}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{{ next }}">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" placeholder="Usuário" name="usuario" value="{{ usuario|default:'' }}" required autofocus>
                            </div>
                            <br>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" placeholder="Senha" id="senha" name="senha" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="alterarVisibilidadeSenha('senha')" title="Mostrar senha">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                            <br>
                            <button type="submit" class="btn btn-success w-100"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                        </form>
                        <p class="text-center mt-3 mb-0">
                            Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
